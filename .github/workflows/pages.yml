name: Pages

# Builds tools.openbot.org on GitHub Pages: the start page (.github/pages) and
# /firmware, the firmware setup page with the ready-made firmware it flashes.
# Pull requests build it (download the "github-pages" artifact to try it);
# master also publishes it.

on:
  push:
    branches: [ master ]
    paths:
      - 'firmware/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'firmware/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robots:
    name: List robot types
    runs-on: ubuntu-latest
    outputs:
      robots: ${{ steps.list.outputs.robots }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "robots=$(python3 firmware/scripts/compile_all.py --list-robots)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.robot }}
    needs: robots
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        robot: ${{ fromJSON(needs.robots.outputs.robots) }}
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Find cores
        id: cores
        run: echo "cores=$(python3 firmware/scripts/compile_all.py --cores ${{ matrix.robot }})" >> "$GITHUB_OUTPUT"

      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
          key: arduino-${{ runner.os }}-${{ steps.cores.outputs.cores }}

      - name: Install cores and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json \
            https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
          arduino-cli core update-index
          for core in ${{ steps.cores.outputs.cores }}; do arduino-cli core install "$core"; done
          arduino-cli lib install PinChangeInterrupt "Adafruit SSD1306" "Adafruit GFX Library" Servo

      - name: Build the ready-made firmware
        run: python3 firmware/scripts/build_site.py --build ${{ matrix.robot }} --out builds

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.robot }}
          path: builds

  site:
    name: Assemble the site
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: builds

      - name: Assemble
        run: |
          mkdir -p _site
          cp -r .github/pages/. _site/
          python3 firmware/scripts/build_site.py --site _site/firmware --builds builds

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
