# This workflow builds and tests the iOS app with CocoaPods and Xcode
# For more information see: https://docs.github.com/actions/guides/building-and-testing-swift

name: IOS CI with cocoapods

on:
  push:
    branches: [ master ]
    paths:
    - 'ios/OpenBot/**'
    - '.github/workflows/cocoapod.yml'
  pull_request:
    branches: [ master ]
    paths:
    - 'ios/OpenBot/**'
    - '.github/workflows/cocoapod.yml'

jobs:
  build:
    runs-on: macos-15

    defaults:
      run:
        working-directory: ios/OpenBot

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer

      - name: Show available SDKs and simulators
        run: |
          xcodebuild -showsdks
          xcrun simctl list devices

      - name: Select iOS Simulator destination
        id: sim
        run: |
          # Pick the latest available iOS simulator runtime installed on the runner.
          LATEST_IOS_RUNTIME="$(xcrun simctl list runtimes | awk '/iOS [0-9]+\.[0-9]+/ && /\(available\)/ { v=$2 } END { print v }')"
          if [ -z "$LATEST_IOS_RUNTIME" ]; then
            echo "No available iOS simulator runtimes found" >&2
            exit 1
          fi
          echo "destination=platform=iOS Simulator,OS=${LATEST_IOS_RUNTIME}" >> "$GITHUB_OUTPUT"

      - name: Install CocoaPods
        run: sudo gem install cocoapods
      
      - name: Install Dependencies
        run: pod install --repo-update
      
      - name: Build
        run: |
          xcodebuild \
            -workspace OpenBot.xcworkspace \
            -scheme OpenBot \
            -sdk iphonesimulator \
            -destination "${{ steps.sim.outputs.destination }}" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            -derivedDataPath build \
            clean build

      - name: Test
        run: |
          xcodebuild \
            -workspace OpenBot.xcworkspace \
            -scheme OpenBot \
            -sdk iphonesimulator \
            -destination "${{ steps.sim.outputs.destination }}" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            -derivedDataPath build \
            clean test
