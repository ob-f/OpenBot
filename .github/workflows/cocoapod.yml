# This workflow builds and tests the iOS app with CocoaPods and Xcode
# For more information see: https://docs.github.com/actions/guides/building-and-testing-swift

name: IOS CI with cocoapods

on:
  push:
    branches: [ master ]
    paths:
    - 'ios/OpenBot/**'
    - '.github/workflows/cocoapod.yml'
  pull_request:
    branches: [ master ]
    paths:
    - 'ios/OpenBot/**'
    - '.github/workflows/cocoapod.yml'

jobs:
  build:
    name: Xcode Checks
    runs-on: macos-14
    defaults:
          run:
            working-directory: ios/OpenBot
    steps:
      - uses: actions/checkout@v4
      - name: Install CocoaPods
        run: sudo gem install cocoapods
      - name: Remove Podfile.lock (regenerate)
        run: rm -f Podfile.lock
      - name: Pod install
        run: pod install
      - name: Build
        run: |
          xcodebuild \
            -workspace OpenBot.xcworkspace \
            -scheme OpenBot \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            -derivedDataPath build \
            build \
            IPHONEOS_DEPLOYMENT_TARGET=13.0
      - name: Test
        run: |
          xcodebuild \
            -workspace OpenBot.xcworkspace \
            -scheme OpenBot \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            -derivedDataPath build \
            test \
            IPHONEOS_DEPLOYMENT_TARGET=13.0
      - name: Upload OpenBot Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: OpenBot-simulator.app
          path: ios/OpenBot/build/Build/Products/Debug-iphonesimulator/OpenBot.app

