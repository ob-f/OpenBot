<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenBot Tools</title>
  <meta name="description" content="Tools for building and setting up OpenBot robots.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f2f4f7; --panel: #fff; --ink: #1f2430; --muted: #5b6475; --line: #d9dee7; --blue: #4b7bff; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #12151c; --panel: #1b1f29; --ink: #e7eaf0; --muted: #9aa3b2; --line: #2c3240; --blue: #6e95ff; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 "Lexend", system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 56px 16px; }
    .brand { font-weight: 600; font-size: 20px; color: var(--ink); text-decoration: none; }
    .brand span { color: var(--blue); font-weight: 400; }
    h1 { font-size: 32px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; margin: 36px 0 10px; }
    p { margin: 0; color: var(--muted); }
    .tools { display: grid; gap: 12px; margin-top: 32px; }
    .tool { display: block; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; }
    .tool:hover { border-color: var(--blue); }
    .tool:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    .tool strong { display: block; font-weight: 500; font-size: 18px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="https://www.openbot.org">OpenBot <span>Tools</span></a>
    <h1>Tools for your OpenBot</h1>
    <p>Build, set up and update your robot from the browser.</p>
    <div class="tools">
      <a class="tool" href="firmware/">
        <strong>Firmware setup</strong>
        <p>Choose your robot and its parts, then flash the firmware over USB or download a settings file for the Arduino IDE.</p>
      </a>
    </div>
  </main>
</body>
</html>
