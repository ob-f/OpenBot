plugins {
    // For a library module, uncomment the following line and comment the one after
    // id 'com.android.library'
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'io.github.reactivecircus.app-versioning' version "1.1.2"
}

appVersioning {
    /**
     * Git root directory used for fetching git tags.
     * Use this to explicitly set the git root directory when the root Gradle project is not the git root directory.
     */
    gitRootDirectory.set(rootProject.file("../")) // if the .git directory is in the root Gradle project's parent directory.
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


        defaultConfig {
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        release {
            if (project.hasProperty('android.injected.signing.store.file')) {
                storeFile file(project.property('android.injected.signing.store.file'))
                storePassword project.property('android.injected.signing.store.password')
                keyAlias project.property('android.injected.signing.key.alias')
                keyPassword project.property('android.injected.signing.key.password')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            versionNameSuffix '1.0'
            if (project.hasProperty('android.injected.signing.store.file')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }

    namespace 'org.openbot.controller'
    ndkVersion '23.1.7779620'
}

// Define the path to the comlib lib directory
def comlibDir = file("${project.rootDir}/comlib/libs")

// The comlib AAR fileTree dependency below reads files produced by :comlib:downloadAars.
// Gradle can't infer that ordering from a raw fileTree, so declare it explicitly.
afterEvaluate {
    tasks.matching { it.name =~ /^collect.*Dependencies$/ }.configureEach {
        dependsOn(':comlib:downloadAars')
    }
}

dependencies {

    // WiFi direct + WebRTC
    implementation project(':comlib')

    // Include AAR files from comlib/lib
    implementation fileTree(dir: comlibDir, include: ['*.aar'])

    //noinspection GradleDependency
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation "com.google.android.gms:play-services-location:$location_version"
    implementation "com.google.android.gms:play-services-nearby:$nearby_version"

    // RxJava
    implementation "io.reactivex.rxjava2:rxjava:2.2.8"
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"

    // material design
    implementation 'com.google.android.material:material:1.4.0'
}
